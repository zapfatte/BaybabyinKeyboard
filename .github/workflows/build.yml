
name: Build Baybayin Keyboard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o BaybayinKeyboard-project.zip -d extracted

      - name: Locate Gradle project
        run: |
          find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Build APK
        run: |
          cd extracted
          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaybayinKeyboard-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
